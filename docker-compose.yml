version: '3.8'

services:
  xhscard-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xhscard-api
    ports:
      - "7000:7000"
    environment:
      - NODE_ENV=production
      - PORT=7000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
